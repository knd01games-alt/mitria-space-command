<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Center Sync - Mitria Space Command</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>

  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: #0b0f19;
      --accent-cyan: #06b6d4;
      --accent-lime: #a3e635;
      --accent-gold: #eab308;
      --text-gray: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg-dark); color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 16px;
    }
    .sync-container {
      width: 100%; max-width: 500px; background: var(--card-bg);
      border: 1px solid #1e293b; border-radius: 20px; padding: 24px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      box-shadow: 0 10px 40px rgba(6, 182, 212, 0.15);
    }
    .sync-title {
      font-size: 18px; font-weight: 900;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-lime));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    canvas {
      width: 100%; height: 200px; border-radius: 12px;
      border: 1px solid #1e293b; background: #020617;
      margin-bottom: 16px; display: block;
    }
    .progress-bar-bg {
      width: 100%; height: 10px; background: #0f172a;
      border-radius: 8px; overflow: hidden; border: 1px solid #334155;
      margin-bottom: 16px;
    }
    .progress-bar-fill {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-lime));
      transition: width 0.1s linear;
    }
    .bonus-box {
      display: none; width: 100%; background: rgba(234, 179, 8, 0.15);
      border: 1px solid var(--accent-gold); color: var(--accent-gold);
      padding: 10px; border-radius: 10px; font-weight: 800; font-size: 12px;
      margin-bottom: 16px;
    }
    .btn-next {
      display: none; width: 100%; padding: 12px;
      background: var(--accent-lime); color: #000;
      font-weight: 900; font-size: 14px; border: none;
      border-radius: 10px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="sync-container">
    <h2 class="sync-title">TRANSMISSÃO DE DADOS DO DATA CENTER</h2>
    <p style="font-size: 12px; color: var(--text-gray); margin-bottom: 14px;">Transferindo pacotes de Hash Power para o servidor em nuvem...</p>

    <canvas id="dcCanvas" width="500" height="200"></canvas>

    <div class="progress-bar-bg">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>

    <div id="bonus-card" class="bonus-box">
      🎉 BÔNUS ESPECIAL DE MINERAÇÃO (5% CHANCE)! +100 HS EXTRA CONCEDIDO NA NUVEM!
    </div>

    <button id="btn-advance" class="btn-next" onclick="goToReward()">AVANÇAR PARA A RECOMPENSA ➔</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const game = urlParams.get('game') || 'aero_dash';
    const stage = parseInt(urlParams.get('stage') || '1');

    let wonBonus = false;

    // Sincronização 100% em Nuvem via Firestore por ID do Usuário (uid)
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = "../login.html";
      } else {
        try {
          const userRef = db.collection('users').doc(user.uid);
          const doc = await userRef.get();

          let gamesPower = 0;
          let minersPower = 0;
          let bonusExtra = 0;
          let gamesPlayed = 0;

          // Regra de Reset Diário às 21:00 (Brasília)
          const now = new Date();
          const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
          const brasiliaTime = new Date(utc - (3 * 3600000));
          let todayDateStr = brasiliaTime.toISOString().split('T')[0];
          let currentHour = brasiliaTime.getHours();

          if (doc.exists) {
            const data = doc.data();
            let lastReset = data.lastResetDate || '';

            if (lastReset !== todayDateStr && currentHour >= 21) {
              gamesPower = 0;
            } else {
              gamesPower = data.gamesPower || 0;
            }

            minersPower = data.minersPower || 0;
            bonusExtra = data.bonusExtra || 0;
            gamesPlayed = data.gamesPlayed || 0;
          }

          // Cálculo do poder ganho com base no jogo
          let earnedPower = 0;
          if (game === 'token_blaster') earnedPower = 21;
          else if (game === 'coin_catcher' || game === 'match3') earnedPower = 15;
          else earnedPower = 16.5;

          gamesPower += earnedPower;
          gamesPlayed += 1;

          // Sorteio de bônus de 5% de chance direto na nuvem
          if (Math.random() < 0.05) {
            wonBonus = true;
            bonusExtra += 100;
            const bonusCard = document.getElementById('bonus-card');
            if (bonusCard) bonusCard.style.display = 'block';
          }

          let totalPower = minersPower + gamesPower + bonusExtra;

          // Gravação atômica no Firestore sem usar localStorage
          await userRef.set({
            gamesPower: gamesPower,
            bonusExtra: bonusExtra,
            totalPower: totalPower,
            gamesPlayed: gamesPlayed,
            lastResetDate: todayDateStr,
            [`lastPlay_${game}`]: Date.now()
          }, { merge: true });

        } catch (err) {
          console.error("Erro ao sincronizar com Firestore no sync.html:", err);
        }
      }
    });

    // Animação visual do Data Center Sync
    const canvas = document.getElementById('dcCanvas');
    const ctx = canvas.getContext('2d');
    const progressFill = document.getElementById('progress-fill');
    const btnAdvance = document.getElementById('btn-advance');

    let startTime = Date.now();
    let durationMs = 2500;

    function update() {
      let elapsed = Date.now() - startTime;
      let progress = Math.min(100, (elapsed / durationMs) * 100);

      progressFill.style.width = `${progress}%`;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0f172a'; ctx.strokeStyle = '#06b6d4';
      ctx.fillRect(50, 40, 80, 120); ctx.strokeRect(50, 40, 80, 120);
      ctx.fillRect(370, 40, 80, 120); ctx.strokeRect(370, 40, 80, 120);

      if (progress < 100) {
        requestAnimationFrame(update);
      } else {
        btnAdvance.style.display = 'block';
      }
    }

    function goToReward() {
      window.location.href = `reward.html?game=${game}&stage=${stage}&bonus=${wonBonus ? 1 : 0}`;
    }

    requestAnimationFrame(update);
  </script>
</body>
</html>
