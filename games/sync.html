<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Center Sync - Mitria Space Command</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>

  <style>
    :root {
      --bg-dark: #030712; --card-bg: #0b0f19; --accent-cyan: #06b6d4; --accent-lime: #a3e635; --accent-gold: #eab308; --text-gray: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg-dark); color: #fff; font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;
    }
    .sync-container {
      width: 100%; max-width: 500px; background: var(--card-bg); border: 1px solid #1e293b; border-radius: 20px; padding: 24px;
      display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 10px 40px rgba(6, 182, 212, 0.15);
    }
    .sync-title {
      font-size: 18px; font-weight: 900; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-lime));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px;
    }
    canvas { width: 100%; height: 200px; border-radius: 12px; border: 1px solid #1e293b; background: #020617; margin-bottom: 16px; display: block; }
    .progress-bar-bg { width: 100%; height: 10px; background: #0f172a; border-radius: 8px; overflow: hidden; border: 1px solid #334155; margin-bottom: 16px; }
    .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-lime)); transition: width 0.1s linear; }
    .bonus-box { display: none; width: 100%; background: rgba(234, 179, 8, 0.15); border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 10px; border-radius: 10px; font-weight: 800; font-size: 12px; margin-bottom: 16px; }
    .btn-next { display: none; width: 100%; padding: 12px; background: var(--accent-lime); color: #000; font-weight: 900; font-size: 14px; border: none; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="sync-container">
    <h2 class="sync-title">TRANSMISSÃO DE DADOS DO DATA CENTER</h2>
    <p style="font-size: 12px; color: var(--text-gray); margin-bottom: 14px;" id="sync-status">Calculando fases, níveis e Rest Power...</p>

    <canvas id="dcCanvas" width="500" height="200"></canvas>

    <div class="progress-bar-bg">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>

    <div id="bonus-card" class="bonus-box">
      🎉 BÔNUS ESPECIAL DE MINERAÇÃO (5% CHANCE)! +100 HS EXTRA CONCEDIDO!
    </div>

    <button id="btn-advance" class="btn-next" onclick="goToHub()">RETORNAR AO GAME HUB ➔</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const game = urlParams.get('game') || 'aero_dash';
    let wonBonus = false;

    // Mapa de chaves para os jogos
    const gameKeyMap = {
      'token_blaster': 'tb',
      'coin_catcher': 'cc',
      'match3': 'm3',
      'crypto_2048': 'c2048',
      'aero_dash': 'ad'
    };
    const shortKey = gameKeyMap[game] || 'ad';
    const stageField = `${shortKey}_stage`;

    // Processamento atômico centralizado no Firestore
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = "../login.html";
      } else {
        try {
          const userRef = db.collection('users').doc(user.uid);
          const doc = await userRef.get();
          let data = doc.exists ? doc.data() : {};

          // Regra de Reset Diário às 21:00 (Brasília)
          const now = new Date();
          const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
          const brasiliaTime = new Date(utc - (3 * 3600000));
          let todayDateStr = brasiliaTime.toISOString().split('T')[0];
          let currentHour = brasiliaTime.getHours();
          let lastReset = data.lastResetDate || '';

          // Se passou das 21h e mudou o dia, reseta tudo
          if (lastReset !== todayDateStr && currentHour >= 21) {
            data.tb_stage = 1;
            data.cc_stage = 1;
            data.match3_stage = 1;
            data.crypto_2048_stage = 1;
            data.ad_stage = 1;
          }

          // Pega a fase atual do jogo específico e avança +1 (até o limite de 30)
          let currentStage = parseInt(data[stageField] || 1);
          if (currentStage < 30) {
            currentStage += 1;
          }
          data[stageField] = currentStage;

          // Calcula o Nível atual (a cada 5 fases = 1 nível)
          let currentLevel = Math.floor((currentStage - 1) / 5) + 1;

          let gamesPlayed = (data.gamesPlayed || 0) + 1;
          let bonusExtra = data.bonusExtra || 0;

          // Sorteio de 5% de chance de bônus extra
          if (Math.random() < 0.05) {
            wonBonus = true;
            bonusExtra += 100;
            document.getElementById('bonus-card').style.display = 'block';
          }

          // Atualiza as fases na estrutura de dados
          let tbS = data.tb_stage || 1;
          let ccS = data.cc_stage || 1;
          let m3S = data.match3_stage || 1;
          let c2048S = data.crypto_2048_stage || 1;
          let adS = data.ad_stage || 1;

          // Cálculo exato do Rest Power por jogo com progressão de nível (multiplicador)
          let tbHS = 0;
          for (let s = 1; s < Math.min(tbS, 31); s++) {
            let lvl = Math.floor((s - 1) / 5) + 1;
            tbHS += 21 * (1 + (lvl - 1) * 0.20);
          }
          let ccHS = 0;
          for (let s = 1; s < Math.min(ccS, 31); s++) {
            let lvl = Math.floor((s - 1) / 5) + 1;
            ccHS += 15 * (1 + (lvl - 1) * 0.20);
          }
          let m3HS = 0;
          for (let s = 1; s < Math.min(m3S, 31); s++) {
            let lvl = Math.floor((s - 1) / 5) + 1;
            m3HS += 15 * (1 + (lvl - 1) * 0.20);
          }
          let c2048HS = 0;
          for (let s = 1; s < Math.min(c2048S, 31); s++) {
            let lvl = Math.floor((s - 1) / 5) + 1;
            c2048HS += 16.5 * (1 + (lvl - 1) * 0.20);
          }
          let adHS = 0;
          for (let s = 1; s < Math.min(adS, 31); s++) {
            let lvl = Math.floor((s - 1) / 5) + 1;
            adHS += 16.5 * (1 + (lvl - 1) * 0.20);
          }

          let gamesPower = tbHS + ccHS + m3HS + c2048HS + adHS;
          let minersPower = data.minersPower || 0;
          let totalPower = minersPower + gamesPower + bonusExtra;

          // Grava na nuvem vinculado ao ID do usuário
          await userRef.set({
            tb_stage: tbS,
            cc_stage: ccS,
            match3_stage: m3S,
            crypto_2048_stage: c2048S,
            ad_stage: adS,
            gamesPower: gamesPower,
            bonusExtra: bonusExtra,
            totalPower: totalPower,
            gamesPlayed: gamesPlayed,
            lastResetDate: todayDateStr,
            [`lastPlay_${game}`]: Date.now()
          }, { merge: true });

          document.getElementById('sync-status').innerText = `Nível ${currentLevel} - Fase ${currentStage}/30 sincronizados com sucesso!`;

        } catch (err) {
          console.error("Erro na sincronização:", err);
          document.getElementById('sync-status').innerText = "Erro ao salvar na nuvem.";
        }
      }
    });

    // Animação da barra
    const canvas = document.getElementById('dcCanvas');
    const ctx = canvas.getContext('2d');
    const progressFill = document.getElementById('progress-fill');
    const btnAdvance = document.getElementById('btn-advance');

    let startTime = Date.now();
    let durationMs = 2500;

    function update() {
      let elapsed = Date.now() - startTime;
      let progress = Math.min(100, (elapsed / durationMs) * 100);

      progressFill.style.width = `${progress}%`;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0f172a'; ctx.strokeStyle = '#06b6d4';
      ctx.fillRect(50, 40, 80, 120); ctx.strokeRect(50, 40, 80, 120);
      ctx.fillRect(370, 40, 80, 120); ctx.strokeRect(370, 40, 80, 120);

      if (progress < 100) {
        requestAnimationFrame(update);
      } else {
        btnAdvance.style.display = 'block';
      }
    }

    function goToHub() {
      window.location.href = `index.html`;
    }

    requestAnimationFrame(update);
  </script>
</body>
</html>
