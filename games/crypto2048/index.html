<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Crypto 2048 - Professional Edition</title>
  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: #0d1117;
      --accent-cyan: #06b6d4;
      --accent-lime: #a3e635;
      --accent-red: #ef4444;
      --text-gray: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 2px solid #21262d;
      border-radius: 12px;
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.2);
      overflow: hidden;
    }

    .game-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #090d16;
      border-bottom: 1px solid #21262d;
      font-size: 13px;
      font-weight: bold;
    }

    .topbar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .topbar-label {
      font-size: 9px;
      color: var(--text-gray);
      text-transform: uppercase;
    }

    .topbar-val {
      font-size: 14px;
      color: var(--accent-cyan);
    }

    .audio-btn {
      background: #161b22;
      border: 1px solid #30363d;
      color: #fff;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 800 / 480;
      background: #030712;
      cursor: pointer;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      top: 45px;
      left: 0;
      width: 100%;
      height: calc(100% - 45px);
      background: rgba(3, 7, 18, 0.95);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .overlay-desc {
      font-size: 12px;
      color: var(--text-gray);
      margin-bottom: 20px;
      max-width: 290px;
      line-height: 1.4;
    }

    .countdown-number {
      font-size: 64px;
      font-weight: 900;
      color: var(--accent-cyan);
      animation: pulse 0.5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(0.9); }
      to { transform: scale(1.1); }
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 240px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent-cyan);
      color: #000;
    }

    .btn-success {
      background: var(--accent-lime);
      color: #000;
    }

    .btn-secondary {
      background: #30363d;
      color: #fff;
    }

    .btn-home {
      background: #161b22;
      color: var(--text-gray);
      border: 1px solid #30363d;
    }

    .level-badge {
      background: var(--accent-lime);
      color: #000;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 800;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <div class="game-topbar">
      <div class="topbar-item">
        <span class="topbar-label">Nível / Fase</span>
        <span class="topbar-val" id="ui-stage">Nível 1 - Fase 1/30</span>
      </div>
      <div class="topbar-item">
        <span class="topbar-label">Pontos / Meta</span>
        <span class="topbar-val" id="ui-score" style="color: var(--accent-lime);">0 / 200</span>
      </div>
      <div class="topbar-item">
        <span class="topbar-label">Tempo</span>
        <span class="topbar-val" id="ui-timer" style="color: #f59e0b;">40s</span>
      </div>
      <button class="audio-btn" onclick="toggleAudio()">
        <span id="audio-icon">🔊</span>
      </button>
    </div>

    <canvas id="gameCanvas" width="800" height="480"></canvas>

    <div id="overlay" class="overlay">
      <span id="level-badge" class="level-badge">NÍVEL 1 - FASE 1 DE 30</span>
      <h2 id="overlay-title" class="overlay-title" style="color: var(--accent-cyan);">CRYPTO 2048</h2>
      <p id="overlay-desc" class="overlay-desc">
        Deslize para juntar as criptomoedas esféricas 3D e atingir a meta de pontuação!
      </p>

      <div id="countdown-box" style="display: none;">
        <div id="countdown-num" class="countdown-number">3</div>
      </div>

      <div id="btn-group" class="btn-group">
        <button id="btn-start" class="btn btn-primary" onclick="startCountdown()">INICIAR JOGO</button>
        <button id="btn-finish" class="btn btn-success" style="display: none;" onclick="goToSync()">CONCLUIR FASE ➔</button>
        <a id="btn-games" href="../index.html" class="btn btn-secondary">← Voltar para os Games</a>
        <a id="btn-home" href="../../index.html" class="btn btn-home" style="display: none;">🏠 Home Page</a>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const levelBadge = document.getElementById('level-badge');
    const countdownBox = document.getElementById('countdown-box');
    const countdownNum = document.getElementById('countdown-num');
    const btnGroup = document.getElementById('btn-group');
    const btnStart = document.getElementById('btn-start');
    const btnFinish = document.getElementById('btn-finish');
    const btnGames = document.getElementById('btn-games');
    const btnHome = document.getElementById('btn-home');

    const uiStage = document.getElementById('ui-stage');
    const uiScore = document.getElementById('ui-score');
    const uiTimer = document.getElementById('ui-timer');
    const audioIcon = document.getElementById('audio-icon');

    let audioEnabled = true;
    let audioCtx = null;
    let bgMusicTimer = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      audioIcon.innerText = audioEnabled ? '🔊' : '🔇';
      if (!audioEnabled && bgMusicTimer) {
        clearInterval(bgMusicTimer);
        bgMusicTimer = null;
      } else if (audioEnabled && gameActive) {
        startBgMusic();
      }
    }

    function playMergeSound() {
      if (!audioEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function startBgMusic() {
      if (!audioEnabled || bgMusicTimer) return;
      initAudio();
      const notes = [261.63, 329.63, 392.00, 523.25];
      let step = 0;
      bgMusicTimer = setInterval(() => {
        if (!gameActive || !audioEnabled) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
        gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
        step++;
      }, 700);
    }

    function stopBgMusic() {
      if (bgMusicTimer) {
        clearInterval(bgMusicTimer);
        bgMusicTimer = null;
      }
    }

    const COINS = [
      { val: 2,    symbol: 'MTR', name: 'Mitra',    base: '#0099ff', glow: '#00ffff', dark: '#003366', text: '#fff' },
      { val: 4,    symbol: 'TRX', name: 'Tron',     base: '#dc2626', glow: '#fca5a5', dark: '#7f1d1d', text: '#fff' },
      { val: 8,    symbol: 'Ł',   name: 'Litecoin', base: '#2563eb', glow: '#93c5fd', dark: '#1e3a8a', text: '#fff' },
      { val: 16,   symbol: '♦',   name: 'Ethereum', base: '#9333ea', glow: '#d8b4fe', dark: '#581c87', text: '#fff' },
      { val: 32,   symbol: 'Ð',   name: 'Dogecoin', base: '#e6b800', glow: '#fff280', dark: '#4d3900', text: '#fff' },
      { val: 64,   symbol: 'SOL', name: 'Solana',   base: '#047857', glow: '#6ee7b7', dark: '#022c22', text: '#fff' },
      { val: 128,  symbol: 'ADA', name: 'Cardano',  base: '#1d4ed8', glow: '#93c5fd', dark: '#0a194d', text: '#fff' },
      { val: 256,  symbol: '⬡',   name: 'BNB',      base: '#ca8a04', glow: '#fef08a', dark: '#713f12', text: '#fff' },
      { val: 512,  symbol: 'XRP', name: 'Ripple',   base: '#475569', glow: '#cbd5e1', dark: '#1e293b', text: '#fff' },
      { val: 1024, symbol: 'ETH2',name: 'Eth 2.0',  base: '#6d28d9', glow: '#e9d5ff', dark: '#3b0764', text: '#fff' },
      { val: 2048, symbol: '₿',   name: 'Bitcoin',  base: '#ff6600', glow: '#ffcc00', dark: '#662200', text: '#fff' }
    ];

    const gridRows = 4;
    const gridCols = 4;
    const tileSize = 95;
    const gridOffsetX = 60;
    const gridOffsetY = 50;

    let board = [];
    let currentPhase = parseInt(localStorage.getItem('crypto_saved_stage') || '1');
    let score = 0;
    let targetScore = 200;
    let timeLeft = 40;
    let gameActive = false;
    let timerInterval = null;

    let touchStartX = 0, touchStartY = 0;

    const stars = Array.from({ length: 60 }, () => ({
      x: Math.random() * 800,
      y: Math.random() * 480,
      size: Math.random() * 2 + 0.5,
      alpha: Math.random()
    }));

    function getPhaseConfig(phase) {
      const level = Math.min(6, Math.floor((phase - 1) / 5) + 1);
      const maxCoinIndex = Math.min(COINS.length - 1, 3 + Math.floor(level / 2) * 2);
      return {
        level: level,
        phase: phase,
        maxCoinIndex: maxCoinIndex,
        targetScore: 150 + (phase * 35)
      };
    }

    function initBoard() {
      board = Array(gridRows).fill(0).map(() => Array(gridCols).fill(0));
      addNewTile();
      addNewTile();
    }

    function addNewTile() {
      let emptyCells = [];
      for (let r = 0; r < gridRows; r++) {
        for (let c = 0; c < gridCols; c++) {
          if (board[r][c] === 0) emptyCells.push({r, c});
        }
      }
      if (emptyCells.length > 0) {
        let cell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        let spawnVal = Math.random() < 0.85 ? COINS[0].val : COINS[1].val;
        board[cell.r][cell.c] = spawnVal;
      }
    }

    function drawBackground() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, 800, 480);

      const neb = ctx.createRadialGradient(400, 240, 50, 400, 240, 400);
      neb.addColorStop(0, 'rgba(6, 182, 212, 0.12)');
      neb.addColorStop(0.5, 'rgba(110, 231, 183, 0.05)');
      neb.addColorStop(1, 'rgba(3, 7, 18, 0)');
      ctx.fillStyle = neb;
      ctx.fillRect(0, 0, 800, 480);

      stars.forEach(s => {
        s.alpha += (Math.random() - 0.5) * 0.08;
        if (s.alpha < 0.2) s.alpha = 0.2;
        if (s.alpha > 1) s.alpha = 1;
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = 'rgba(13, 17, 23, 0.9)';
      ctx.strokeStyle = '#21262d';
      ctx.lineWidth = 3;
      let boardWidth = gridCols * tileSize;
      let boardHeight = gridRows * tileSize;
      ctx.fillRect(gridOffsetX - 10, gridOffsetY - 10, boardWidth + 20, boardHeight + 20);
      ctx.strokeRect(gridOffsetX - 10, gridOffsetY - 10, boardWidth + 20, boardHeight + 20);

      for (let r = 0; r < gridRows; r++) {
        for (let c = 0; c < gridCols; c++) {
          let x = gridOffsetX + c * tileSize;
          let y = gridOffsetY + r * tileSize;
          ctx.fillStyle = '#161b22';
          ctx.fillRect(x + 5, y + 5, tileSize - 10, tileSize - 10);
        }
      }

      ctx.fillStyle = 'rgba(13, 17, 23, 0.9)';
      ctx.fillRect(500, 40, 260, 400);
      ctx.strokeStyle = '#21262d';
      ctx.strokeRect(500, 40, 260, 400);

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText("EVOLUÇÃO DE MOEDAS", 515, 65);

      const cfg = getPhaseConfig(currentPhase);
      let listY = 85;
      for (let i = 0; i <= Math.min(5, cfg.maxCoinIndex); i++) {
        let coin = COINS[i];
        ctx.fillStyle = coin.base;
        ctx.beginPath();
        ctx.arc(530, listY + 10, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = '11px sans-serif';
        ctx.fillText(`${coin.val} - ${coin.name} (${coin.symbol})`, 555, listY + 14);
        listY += 28;
      }
    }

    function drawBoard() {
      for (let r = 0; r < gridRows; r++) {
        for (let c = 0; c < gridCols; c++) {
          let val = board[r][c];
          if (val === 0) continue;

          let coin = COINS.find(item => item.val === val) || COINS[0];
          let x = gridOffsetX + c * tileSize;
          let y = gridOffsetY + r * tileSize;

          ctx.fillStyle = '#f8fafc';
          ctx.fillRect(x + 6, y + 6, tileSize - 12, tileSize - 12);
          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(x + 6, y + 6, tileSize - 12, tileSize - 12);

          let centerX = x + tileSize / 2;
          let centerY = y + tileSize / 2;
          let radius = (tileSize - 26) / 2;

          ctx.save();
          ctx.translate(centerX, centerY);

          ctx.shadowColor = coin.glow;
          ctx.shadowBlur = 10;

          const sphereGrad = ctx.createRadialGradient(-5, -5, 2, 0, 0, radius);
          sphereGrad.addColorStop(0, coin.glow);
          sphereGrad.addColorStop(0.35, coin.base);
          sphereGrad.addColorStop(1, coin.dark);

          ctx.fillStyle = sphereGrad;
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.shadowBlur = 0;

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.arc(0, 0, radius - 3, 0, Math.PI * 2);
          ctx.stroke();

          const highGrad = ctx.createRadialGradient(-6, -6, 1, -6, -6, 7);
          highGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
          highGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = highGrad;
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = coin.text;
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(coin.symbol, 0, 1);

          ctx.restore();
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      drawBoard();
    }

    function slide(row) {
      let arr = row.filter(val => val !== 0);
      let missing = gridCols - arr.length;
      let zeros = Array(missing).fill(0);
      return arr.concat(zeros);
    }

    function combine(row) {
      for (let i = 0; i < row.length - 1; i++) {
        if (row[i] !== 0 && row[i] === row[i + 1]) {
          row[i] *= 2;
          score += row[i];
          row[i + 1] = 0;
          playMergeSound();
        }
      }
      return row;
    }

    function moveLeft() {
      let moved = false;
      for (let r = 0; r < gridRows; r++) {
        let row = board[r];
        let original = [...row];
        row = slide(row);
        row = combine(row);
        row = slide(row);
        board[r] = row;
        if (original.toString() !== row.toString()) moved = true;
      }
      return moved;
    }

    function rotateBoard() {
      let newBoard = Array(gridRows).fill(0).map(() => Array(gridCols).fill(0));
      for (let r = 0; r < gridRows; r++) {
        for (let c = 0; c < gridCols; c++) {
          newBoard[c][gridRows - 1 - r] = board[r][c];
        }
      }
      board = newBoard;
    }

    function makeMove(direction) {
      if (!gameActive) return;
      let moved = false;

      if (direction === 'left') {
        moved = moveLeft();
      } else if (direction === 'right') {
        rotateBoard();
        rotateBoard();
        moved = moveLeft();
        rotateBoard();
        rotateBoard();
      } else if (direction === 'up') {
        rotateBoard();
        rotateBoard();
        rotateBoard();
        moved = moveLeft();
        rotateBoard();
      } else if (direction === 'down') {
        rotateBoard();
        moved = moveLeft();
        rotateBoard();
        rotateBoard();
        rotateBoard();
      }

      if (moved) {
        addNewTile();
        uiScore.innerText = `${score} / ${targetScore}`;
        render();

        if (score >= targetScore) {
          triggerPhaseComplete();
        } else if (isGameOver()) {
          endGame(false, "Sem movimentos disponíveis!");
        }
      }
    }

    function isGameOver() {
      for (let r = 0; r < gridRows; r++) {
        for (let c = 0; c < gridCols; c++) {
          if (board[r][c] === 0) return false;
          if (c < gridCols - 1 && board[r][c] === board[r][c + 1]) return false;
          if (r < gridRows - 1 && board[r][c] === board[r + 1][c]) return false;
        }
      }
      return true;
    }

    canvas.addEventListener('touchstart', (e) => {
      if (!gameActive) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      if (!gameActive) return;
      let dx = e.changedTouches[0].clientX - touchStartX;
      let dy = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > 30) {
          makeMove(dx > 0 ? 'right' : 'left');
        }
      } else {
        if (Math.abs(dy) > 30) {
          makeMove(dy > 0 ? 'down' : 'up');
        }
      }
    });

    window.addEventListener('keydown', (e) => {
      if (!gameActive) return;
      if (e.key === 'ArrowLeft') makeMove('left');
      if (e.key === 'ArrowRight') makeMove('right');
      if (e.key === 'ArrowUp') makeMove('up');
      if (e.key === 'ArrowDown') makeMove('down');
    });

    function startCountdown() {
      initAudio();
      btnGroup.style.display = 'none';
      countdownBox.style.display = 'block';
      let count = 3;
      countdownNum.innerText = count;

      const cdInterval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownNum.innerText = count;
        } else if (count === 0) {
          countdownNum.innerText = "READY!";
        } else {
          clearInterval(cdInterval);
          countdownBox.style.display = 'none';
          overlay.classList.add('hidden');
          runGame();
        }
      }, 750);
    }

    function runGame() {
      const cfg = getPhaseConfig(currentPhase);
      targetScore = cfg.targetScore;
      score = 0;
      timeLeft = 40;
      gameActive = true;

      initBoard();

      uiStage.innerText = `Nível ${cfg.level} - Fase ${currentPhase}/30`;
      uiScore.innerText = `${score} / ${targetScore}`;
      uiTimer.innerText = `${timeLeft}s`;

      startBgMusic();
      render();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          uiTimer.innerText = `${timeLeft}s`;
        } else {
          if (score < targetScore) {
            clearInterval(timerInterval);
            endGame(false, "O tempo esgotou antes de atingir a meta!");
          }
        }
      }, 1000);
    }

    function triggerPhaseComplete() {
      gameActive = false;
      stopBgMusic();
      clearInterval(timerInterval);
      overlay.classList.remove('hidden');

      const cfg = getPhaseConfig(currentPhase);
      levelBadge.innerText = `NÍVEL ${cfg.level} - FASE ${currentPhase} DE 30`;

      if (currentPhase >= 30) {
        overlayTitle.innerText = "PARABÉNS! JOGO CONCLUÍDO!";
        overlayTitle.style.color = "var(--accent-lime)";
        overlayDesc.innerText = "Você concluiu com sucesso todas as 30 fases do Crypto 2048!";
      } else {
        overlayTitle.innerText = "FASE CONCLUÍDA!";
        overlayTitle.style.color = "var(--accent-lime)";
        overlayDesc.innerText = "Excelente fusão! Clique no botão abaixo para prosseguir e transferir os dados.";
      }

      btnStart.style.display = 'none';
      btnFinish.style.display = 'block';
      btnGames.style.display = 'block';
      btnHome.style.display = 'none';
      btnGroup.style.display = 'flex';
    }

    function goToSync() {
      let nextPhase = currentPhase + 1;
      localStorage.setItem('crypto_saved_stage', nextPhase.toString());
      if (nextPhase > 30) nextPhase = 31;
      window.location.href = `../sync.html?game=crypto_2048&stage=${nextPhase}`;
    }

    function endGame(won, reason) {
      gameActive = false;
      stopBgMusic();
      clearInterval(timerInterval);

      const cfg = getPhaseConfig(currentPhase);
      overlay.classList.remove('hidden');
      levelBadge.innerText = `NÍVEL ${cfg.level} - FASE ${currentPhase} DE 30`;

      if (won) {
        triggerPhaseComplete();
      } else {
        overlayTitle.innerText = "GAME OVER";
        overlayTitle.style.color = "var(--accent-red)";
        overlayDesc.innerText = reason;

        btnStart.innerText = "NOVA PARTIDA";
        btnStart.style.display = 'block';
        btnFinish.style.display = 'none';
        btnGames.innerText = "← Voltar aos Jogos";
        btnGames.style.display = 'block';
        btnHome.style.display = 'none';
        btnGroup.style.display = 'flex';
        currentPhase = 1;
      }
    }

    initBoard();
    render();
  </script>
</body>
</html>
