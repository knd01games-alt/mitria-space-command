<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITRIA SPACE COMMAND - Login & Cadastro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/profile.js" defer></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap');
    body { background-color: #030712; color: #e2e8f0; font-family: 'Rajdhani', sans-serif; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .glow-blue { box-shadow: 0 0 20px rgba(14, 165, 233, 0.3); }
    .card-bg { background: linear-gradient(180deg, #0b132b 0%, #030712 100%); border: 1px solid #1e293b; }
    
    .captcha-box { background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .puzzle-canvas-container { width: 100%; height: 120px; background: #111827 url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=80') center/cover; border-radius: 6px; position: relative; overflow: hidden; border: 1px solid #334155; }
    .puzzle-hole { position: absolute; top: 35px; left: 180px; width: 45px; height: 45px; background: rgba(0, 0, 0, 0.75); border: 2px dashed #0284c7; border-radius: 6px; }
    .puzzle-piece { position: absolute; top: 35px; left: 10px; width: 45px; height: 45px; background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=80') center/cover; border: 2px solid #38bdf8; border-radius: 6px; box-shadow: 0 0 10px rgba(56, 189, 248, 0.8); cursor: grab; }
    .slider-track { width: 100%; height: 12px; background: #1e293b; border-radius: 6px; position: relative; }
    .slider-thumb { width: 36px; height: 24px; background: #0284c7; border-radius: 4px; position: absolute; top: -6px; left: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; transition: background 0.2s; }
    .slider-thumb:hover { background: #38bdf8; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center px-4 py-8">

  <!-- CARD PRINCIPAL -->
  <div class="w-full max-w-md card-bg rounded-2xl p-6 glow-blue space-y-6">
    
    <!-- Logo -->
    <div class="flex flex-col items-center justify-center space-y-2 text-center">
      <div class="w-14 h-14 border-2 border-cyan-400 rotate-45 flex items-center justify-center bg-cyan-950/40 glow-blue">
        <i class="fa-solid fa-cube -rotate-45 text-cyan-400 text-2xl"></i>
      </div>
      <div>
        <h1 class="font-orbitron font-extrabold text-2xl tracking-widest text-white">MITRIA</h1>
        <span class="text-xs text-cyan-400 tracking-widest font-semibold uppercase">Space Command</span>
      </div>
    </div>

    <!-- Abas Alternáveis -->
    <div class="flex border-b border-slate-800 text-sm font-bold font-orbitron">
      <button id="tab-login-btn" onclick="switchForm('login')" class="flex-1 py-2 text-cyan-400 border-b-2 border-cyan-400 transition">LOGIN</button>
      <button id="tab-signup-btn" onclick="switchForm('signup')" class="flex-1 py-2 text-slate-500 hover:text-slate-300 transition">CADASTRAR</button>
    </div>

    <!-- Botão Google -->
    <button onclick="loginWithGoogle()" class="w-full bg-slate-900 border border-slate-700 hover:border-slate-500 py-2.5 px-4 rounded-xl flex items-center justify-center space-x-3 text-sm font-bold text-white transition">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Continuar com o Google</span>
    </button>

    <div class="flex items-center space-x-2 text-xs text-slate-500">
      <div class="flex-1 h-px bg-slate-800"></div>
      <span>OU VIA E-MAIL</span>
      <div class="flex-1 h-px bg-slate-800"></div>
    </div>

    <!-- FORMULÁRIO DE ENTRADA -->
    <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
      
      <!-- Nome de Usuário (Apenas no Cadastro) -->
      <div id="username-field" class="hidden space-y-1">
        <label class="text-xs font-bold text-slate-400">NOME DE USUÁRIO</label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-3 top-3 text-slate-500 text-xs"></i>
          <input type="text" id="input-username" placeholder="Digite seu Nickname" class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
        </div>
      </div>

      <!-- E-mail -->
      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-400">E-MAIL</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3 top-3 text-slate-500 text-xs"></i>
          <input type="email" id="input-email" required placeholder="seuemail@exemplo.com" class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
        </div>
      </div>

      <!-- Senha -->
      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-400">SENHA</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-500 text-xs"></i>
          <input type="password" id="input-password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
        </div>
      </div>

      <!-- CAPTCHA DE QUEBRA-CABEÇA -->
      <div class="space-y-1 pt-1">
        <div class="flex justify-between items-center">
          <label class="text-xs font-bold text-slate-400">VERIFICAÇÃO DE SEGURANÇA</label>
          <span id="captcha-status" class="text-[10px] font-bold text-amber-400">ARRASTE O PUZZLE</span>
        </div>

        <div class="captcha-box">
          <div class="puzzle-canvas-container">
            <div class="puzzle-hole"></div>
            <div id="puzzle-piece" class="puzzle-piece"></div>
          </div>
          <div class="slider-track">
            <input type="range" id="puzzle-slider" min="0" max="100" value="0" oninput="movePuzzlePiece(this.value)" onchange="checkPuzzleSolution(this.value)" class="w-full opacity-0 cursor-pointer absolute inset-0 z-10">
            <div id="slider-thumb" class="slider-thumb">
              <i class="fa-solid fa-arrows-left-right"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Botão de Ação Principal -->
      <button id="btn-submit" type="submit" disabled class="w-full bg-slate-800 text-slate-500 font-orbitron font-bold py-3 rounded-xl transition cursor-not-allowed">
        ENTRAR NO COMANDO
      </button>
    </form>
  </div>

  <script>
    let currentMode = 'login';
    let captchaPassed = false;
    const targetPosition = 170;

    function switchForm(mode) {
      currentMode = mode;
      const usernameField = document.getElementById('username-field');
      const submitBtn = document.getElementById('btn-submit');
      const loginTab = document.getElementById('tab-login-btn');
      const signupTab = document.getElementById('tab-signup-btn');

      if (mode === 'signup') {
        usernameField.classList.remove('hidden');
        submitBtn.innerText = "CRIAR MINHA CONTA";
        signupTab.className = "flex-1 py-2 text-cyan-400 border-b-2 border-cyan-400 transition";
        loginTab.className = "flex-1 py-2 text-slate-500 hover:text-slate-300 transition";
      } else {
        usernameField.classList.add('hidden');
        submitBtn.innerText = "ENTRAR NO COMANDO";
        loginTab.className = "flex-1 py-2 text-cyan-400 border-b-2 border-cyan-400 transition";
        signupTab.className = "flex-1 py-2 text-slate-500 hover:text-slate-300 transition";
      }
    }

    function movePuzzlePiece(value) {
      const piece = document.getElementById('puzzle-piece');
      const thumb = document.getElementById('slider-thumb');
      const maxMove = 220;
      const currentPos = (value / 100) * maxMove;
      piece.style.left = (10 + currentPos) + 'px';
      thumb.style.left = value + '%';
    }

    function checkPuzzleSolution(value) {
      const maxMove = 220;
      const currentPos = 10 + (value / 100) * maxMove;
      const statusText = document.getElementById('captcha-status');
      const submitBtn = document.getElementById('btn-submit');

      if (Math.abs(currentPos - targetPosition) <= 8) {
        captchaPassed = true;
        statusText.innerText = "✔ VERIFICADO";
        statusText.className = "text-[10px] font-bold text-emerald-400";
        submitBtn.disabled = false;
        submitBtn.className = "w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-orbitron font-bold py-3 rounded-xl transition shadow-lg cursor-pointer";
      } else {
        captchaPassed = false;
        statusText.innerText = "✖ TENTE NOVAMENTE";
        statusText.className = "text-[10px] font-bold text-red-400";
        submitBtn.disabled = true;
        submitBtn.className = "w-full bg-slate-800 text-slate-500 font-orbitron font-bold py-3 rounded-xl transition cursor-not-allowed";
      }
    }

    // Processar Autenticação Firebase (Login ou Cadastro via E-mail)
    async function handleAuth(event) {
      event.preventDefault();
      if (!captchaPassed) {
        alert("Por favor, encaixe o quebra-cabeça primeiro!");
        return;
      }

      const email = document.getElementById('input-email').value;
      const password = document.getElementById('input-password').value;
      const username = document.getElementById('input-username').value;

      try {
        if (currentMode === 'signup') {
          // Criar nova conta no Firebase
          const userCredential = await auth.createUserWithEmailAndPassword(email, password);
          const user = userCredential.user;
          
          // Gravar documento zerado no Firestore
          await db.collection('users').doc(user.uid).set({
            username: username || 'Comandante',
            email: email,
            photoURL: '',
            mthBalance: 0.00,
            totalPower: 0,
            minersPower: 0,
            gamesPower: 0,
            temporaryPower: 0,
            gamesPlayed: 0,
            gamesWon: 0,
            createdAt: new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' })
          });

          alert("Conta criada com sucesso! Entrando...");
        } else {
          // Fazer Login com e-mail existente
          await auth.signInWithEmailAndPassword(email, password);
        }
        window.location.href = "index.html";
      } catch (error) {
        alert("Erro na autenticação: " + error.message);
      }
    }
  </script>
</body>
</html>
