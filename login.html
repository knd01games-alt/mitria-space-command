<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITRIA SPACE COMMAND - Login & Cadastro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@600&display=swap');
    body { background-color: #030712; color: #e2e8f0; font-family: 'Rajdhani', sans-serif; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .card-bg { background: linear-gradient(180deg, #0b132b 0%, #030712 100%); border: 1px solid #1e293b; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md card-bg rounded-2xl p-6 space-y-6 border border-slate-800 shadow-2xl">
    
    <div class="text-center space-y-1">
      <h1 class="font-orbitron font-extrabold text-2xl tracking-widest text-white">MITRIA</h1>
      <p class="text-xs text-cyan-400 font-bold uppercase tracking-widest">Space Command</p>
    </div>

    <div class="flex border-b border-slate-800 text-sm font-orbitron font-bold">
      <button id="btn-tab-login" type="button" onclick="setMode('login')" class="flex-1 py-2 text-cyan-400 border-b-2 border-cyan-400">LOGIN</button>
      <button id="btn-tab-signup" type="button" onclick="setMode('signup')" class="flex-1 py-2 text-slate-500 hover:text-slate-300">CADASTRAR</button>
    </div>

    <button type="button" onclick="handleGoogleLogin()" class="w-full bg-slate-900 border border-slate-700 hover:border-cyan-400 py-3 rounded-xl flex items-center justify-center space-x-3 text-sm font-bold text-white transition cursor-pointer">
      <i class="fa-brands fa-google text-red-500 text-base"></i>
      <span>Continuar com o Google</span>
    </button>

    <div class="flex items-center space-x-2 text-xs text-slate-600">
      <div class="flex-1 h-px bg-slate-800"></div>
      <span>OU USAR E-MAIL</span>
      <div class="flex-1 h-px bg-slate-800"></div>
    </div>

    <form id="auth-form" onsubmit="handleEmailAuth(event)" class="space-y-4">
      <div id="box-username" class="hidden space-y-1">
        <label class="text-xs font-bold text-slate-400">NOME DE USUÁRIO</label>
        <input type="text" id="username" placeholder="Seu Nickname" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-400">
      </div>

      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-400">E-MAIL</label>
        <input type="email" id="email" required placeholder="seuemail@exemplo.com" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-400">
      </div>

      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-400">SENHA</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-400">
      </div>

      <button id="btn-submit" type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-orbitron font-bold py-3 rounded-xl transition cursor-pointer">
        ENTRAR NO COMANDO
      </button>
    </form>
  </div>

  <script>
    let mode = 'login';

    function setMode(m) {
      mode = m;
      document.getElementById('box-username').classList.toggle('hidden', m === 'login');
      document.getElementById('btn-submit').innerText = m === 'signup' ? "CRIAR MINHA CONTA" : "ENTRAR NO COMANDO";
      document.getElementById('btn-tab-login').className = m === 'login' ? "flex-1 py-2 text-cyan-400 border-b-2 border-cyan-400" : "flex-1 py-2 text-slate-500";
      document.getElementById('btn-tab-signup').className = m === 'signup' ? "flex-1 py-2 text-cyan-400 border-b-2 border-cyan-400" : "flex-1 py-2 text-slate-500";
    }

    async function handleGoogleLogin() {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        const result = await auth.signInWithPopup(provider);
        const user = result.user;
        
        const userRef = db.collection('users').doc(user.uid);
        
        try {
          const docSnap = await userRef.get();
          if (!docSnap.exists) {
            await userRef.set({
              username: user.displayName || 'Comandante',
              email: user.email,
              photoURL: user.photoURL || '',
              mthBalance: 0.00,
              totalPower: 0,
              createdAt: new Date().toLocaleDateString('pt-BR')
            }, { merge: true });
          }
        } catch (dbErr) {
          console.warn("Aviso do banco (ignorado para permitir entrada):", dbErr);
        }

        window.location.href = 'index.html';
      } catch (error) {
        alert("Erro ao entrar com Google: " + error.message);
      }
    }

    async function handleEmailAuth(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const username = document.getElementById('username').value.trim();

      try {
        if (mode === 'signup') {
          const userCred = await auth.createUserWithEmailAndPassword(email, password);
          const user = userCred.user;

          try {
            await db.collection('users').doc(user.uid).set({
              username: username || 'Comandante',
              email: email,
              photoURL: '',
              mthBalance: 0.00,
              totalPower: 0,
              createdAt: new Date().toLocaleDateString('pt-BR')
            }, { merge: true });
          } catch (dbErr) {
            console.warn("Aviso do banco:", dbErr);
          }
          alert("Conta criada com sucesso!");
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
        window.location.href = 'index.html';
      } catch (error) {
        if (error.code === 'auth/email-already-in-use') {
          alert("Este e-mail já está cadastrado! Mude para a aba LOGIN para entrar.");
        } else {
          alert("Erro na autenticação: " + error.message);
        }
      }
    }
  </script>
</body>
</html>
