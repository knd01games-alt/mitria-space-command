<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Capa - Token Blaster</title>
  <style>
    body {
      background-color: #030712;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }
    .cover-canvas-box {
      width: 260px;
      height: 220px;
      background: #0d1117;
      border: 2px solid #06b6d4;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Grid de fundo sci-fi */
    .bg-grid {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: linear-gradient(rgba(30, 41, 59, 0.3) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(30, 41, 59, 0.3) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    /* Nave de combate estilizada em 3D / Neon */
    .ship-container {
      position: relative;
      width: 120px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatShip 2s ease-in-out infinite alternate;
    }
    @keyframes floatShip {
      from { transform: translateY(-4px) rotate(-3deg); }
      to { transform: translateY(4px) rotate(3deg); }
    }
    .ship-body {
      width: 80px;
      height: 32px;
      background: linear-gradient(135deg, #ef4444, #7f1d1d);
      border-radius: 4px 50% 50% 4px;
      position: relative;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.7);
    }
    .ship-cockpit {
      position: absolute;
      right: 25px;
      top: 8px;
      width: 24px;
      height: 14px;
      background: #06b6d4;
      border-radius: 50%;
      box-shadow: 0 0 10px #06b6d4;
    }
    .ship-thruster {
      position: absolute;
      left: -18px;
      top: 10px;
      width: 18px;
      height: 12px;
      background: #f59e0b;
      border-radius: 50% 0 0 50%;
      box-shadow: 0 0 15px #f59e0b;
      animation: flamePulse 0.2s ease-in-out infinite alternate;
    }
    @keyframes flamePulse {
      from { width: 14px; opacity: 0.8; }
      to { width: 22px; opacity: 1; }
    }
    /* Lasers disparando */
    .laser-beam {
      position: absolute;
      right: -40px;
      top: 13px;
      width: 50px;
      height: 4px;
      background: #06b6d4;
      box-shadow: 0 0 10px #06b6d4;
      border-radius: 2px;
    }
    .laser-beam-2 {
      position: absolute;
      right: -30px;
      top: 22px;
      width: 35px;
      height: 3px;
      background: #a3e635;
      box-shadow: 0 0 8px #a3e635;
      border-radius: 2px;
    }
    .game-title-tag {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #06b6d4;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="cover-canvas-box">
    <div class="bg-grid"></div>
    <div class="ship-container">
      <div class="ship-thruster"></div>
      <div class="ship-body">
        <div class="ship-cockpit"></div>
      </div>
      <div class="laser-beam"></div>
      <div class="laser-beam-2"></div>
    </div>
  </div>
  <div class="game-title-tag">Token Blaster Cover</div>

</body>
</html>
